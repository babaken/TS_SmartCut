name: tests

# Public repository: runs on pushes to main and on PRs.
# Private development repository (TS_SmartCut-dev): runs only on PRs and by hand, to save the private
# repository's free minutes (pushes don't start it there).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'push' || github.repository == 'babaken/TS_SmartCut'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action reads the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    if: github.event_name != 'push' || github.repository == 'babaken/TS_SmartCut'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ffmpeg, ffprobe, mpv and libmpv are not Python packages; the tests use the real ones.
      # ffmpeg: Linux tests the oldest supported version (8.1; 7.x re-encodes interlaced H.264 as gray pictures,
      # Ubuntu 24.04's 6.1 reports no progress for stream copy), Windows the newest.
      - name: mpv, libmpv, Qt's libraries and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv libmpv2 xvfb xauth \
            libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-xfixes0
      - name: ffmpeg 8.1 (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cd "$RUNNER_TEMP/ffmpeg"
          gh release download latest -R BtbN/FFmpeg-Builds -p 'ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz'
          tar xf ffmpeg-*.tar.xz --strip-components=1
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: mpv and libmpv (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'libmpv'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          # libmpv-2.dll for the preview and mpv.exe for the dependency check
          gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-[0-9]*-git-*.7z' -p 'mpv-x86_64-[0-9]*-git-*.7z'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($f in Get-ChildItem *.7z) { 7z x -y $f.FullName | Out-Null; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          Get-Item libmpv-2.dll, mpv.exe -ErrorAction Stop | Format-Table -AutoSize Name, Length
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Python packages and the Rust part (ts_smartcut_native)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0" "numpy>=1.26"
          python -m pip install ./native
      - name: Versions
        shell: pwsh
        run: |
          ffmpeg -hide_banner -version | Select-Object -First 1
          (Get-Command mpv -ErrorAction Stop).Source
          mpv --version | Select-Object -First 1
          python -c "import sys, PySide6, ts_smartcut_native as n; print(sys.version, PySide6.__version__, n.VERSION)"

      - name: Tests (Linux, X virtual display, Mesa's software OpenGL)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -p no:faulthandler
      - name: Tests (Windows, Qt's software OpenGL)
        if: runner.os == 'Windows'
        env:
          QT_OPENGL: software
        run: python -m pytest -q -p no:faulthandler
